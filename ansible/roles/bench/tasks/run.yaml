---
- name: Create local benchmark log directory
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../logs"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true

- name: Generate benchmark timestamp
  ansible.builtin.set_fact:
    benchmark_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"

- name: Set benchmark log path
  ansible.builtin.set_fact:
    benchmark_log: "/tmp/benchmarker_{{ benchmark_timestamp }}.log"

- name: Run benchmark
  block:
    - name: Execute benchmarker
      ansible.builtin.shell: >-
        {{ benchmarker_bin }}
        -u {{ benchmarker_userdata }}
        -t {{ benchmark_target_url }}
        > {{ benchmark_log }} 2>&1
      args:
        executable: /bin/bash
        chdir: "{{ benchmarker_workdir }}"
      become_user: isucon
      register: benchmark_result
      changed_when: true
  always:
    - name: Fetch benchmark log
      ansible.builtin.fetch:
        src: "{{ benchmark_log }}"
        dest: "{{ playbook_dir }}/../logs/"
        flat: true
      become: true

    - name: Read benchmark log tail
      ansible.builtin.command:
        cmd: "tail -n 20 {{ benchmark_log }}"
      register: benchmark_log_tail
      changed_when: false
      become: true

    - name: Show benchmark log tail
      ansible.builtin.debug:
        msg: "{{ benchmark_log_tail.stdout }}"
