server {
  listen 80;

  client_max_body_size 10m;
  root /home/isucon/private_isu/webapp/public/;

  location /image/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600, immutable";
  }

  location /css/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600, immutable";
  }

  location /js/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600, immutable";
  }

  location /img/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600, immutable";
  }

  location = /favicon.ico {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600, immutable";
  }

  location = /_internal/export-images {
    return 404;
  }

  location / {
    proxy_set_header Host $host;
    proxy_pass http://localhost:8080;
  }
}
