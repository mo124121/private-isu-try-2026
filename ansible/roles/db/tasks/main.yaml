---
# 追加ユーザーが必要になった場合だけ inventory の db_user_hosts に指定する。
- name: Create isucon user with full privileges
  become: true
  ansible.builtin.shell: |
    mysql --execute="
      CREATE USER IF NOT EXISTS 'isucon'@'{{ item }}' IDENTIFIED BY 'isucon';
      GRANT ALL PRIVILEGES ON *.* TO 'isucon'@'{{ item }}' WITH GRANT OPTION;
    "
  args:
    executable: /bin/bash
  changed_when: false
  loop: "{{ db_user_hosts | default([]) }}"

- name: Deploy mysqld.cnf
  become: true
  ansible.builtin.copy:
    src: etc/mysql/mysql.conf.d/mysqld.cnf
    dest: /etc/mysql/mysql.conf.d/mysqld.cnf
    owner: root
    group: root
    mode: "0644"
    backup: false
  notify: restart_db
