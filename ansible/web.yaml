---
- name: Deploy Go web application
  hosts: webapp
  become: true
  tasks:
    - name: Synchronize source and public assets
      ansible.builtin.import_role:
        name: web
        tasks_from: sync

    - name: Import target-side build
      ansible.builtin.import_role:
        name: web
        tasks_from: build

    - name: Switch systemd service to Go
      ansible.builtin.import_role:
        name: web
        tasks_from: deploy
